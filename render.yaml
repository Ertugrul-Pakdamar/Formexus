# Render.com Deployment Configuration
# Note: This file provides a template. Some values must be set manually in Render dashboard.

services:
  # Backend Service (Go/Fiber)
  - type: web
    name: formexus-backend
    runtime: go
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: go build -o server cmd/server/main.go
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: MONGODB_DATABASE
        value: formexus
      - key: JWT_SECRET
        generateValue: true # Auto-generate secure secret
      - key: JWT_EXPIRATION
        value: 24h
      - key: GOOGLE_CLIENT_ID
        sync: false # Set manually
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set manually
      - key: GOOGLE_REDIRECT_URL
        sync: false # Set manually: https://your-backend.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        sync: false # Set manually: https://your-frontend.onrender.com

  # Frontend Service (React/Vite)
  - type: web
    name: formexus-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set manually: https://your-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # Set manually in Render dashboard

