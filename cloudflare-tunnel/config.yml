tunnel: 5d3b6d91-4475-47e1-8a0e-6f7072e22632
credentials-file: /etc/cloudflared/cert.json

ingress:
  # Backend API - MUST BE FIRST (path matching)
  - hostname: formexus.net
    path: /api/*
    service: http://backend:8080
  
  # Frontend - www redirect
  - hostname: www.formexus.net
    service: http://frontend:80
  
  # Frontend - formexus.net (catch-all for this hostname)
  - hostname: formexus.net
    service: http://frontend:80
  
  # Catch-all rule
  - service: http_status:404
